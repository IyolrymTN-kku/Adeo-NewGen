/* =========================
   TOP HERO = ONE BIG PANEL
   Updated: 3 top boxes merged into one panel
========================= */

.adeo-hero {
  display: grid;
  grid-template-columns: 360px minmax(0, 1fr) 320px;
  gap: 0;
  align-items: stretch;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 28px;
  background:
    radial-gradient(circle at 8% 20%, rgba(79, 140, 255, 0.14), transparent 34%),
    radial-gradient(circle at 82% 10%, rgba(139, 92, 246, 0.12), transparent 32%),
    linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
    var(--surface);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
}

.adeo-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(135deg, rgba(79,140,255,.06), transparent 36%),
    linear-gradient(315deg, rgba(34,211,238,.04), transparent 46%);
}

.adeo-hero-panel {
  position: relative;
  z-index: 1;
  min-height: 190px;
  padding: 24px;
  background: transparent;
}

.adeo-hero-panel + .adeo-hero-panel {
  border-left: 1px solid var(--border);
}

.adeo-brand {
  min-height: auto;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.adeo-command-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.adeo-command-title {
  margin-bottom: 14px;
}

.adeo-command-box {
  min-height: 64px;
}

.adeo-tags {
  margin-top: 16px;
}

.adeo-action-card {
  display: flex;
  align-items: center;
  justify-content: center;
}

.adeo-actions {
  width: 100%;
  height: auto;
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 10px;
}

.adeo-actions .btn-primary {
  grid-column: 1 / -1;
  min-height: 46px;
}

.adeo-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.adeo-command-icon svg {
  width: 20px;
  height: 20px;
  color: var(--accent);
}

@media (max-width: 1200px) {
  .adeo-hero {
    grid-template-columns: 1fr;
  }

  .adeo-hero-panel + .adeo-hero-panel {
    border-left: 0;
    border-top: 1px solid var(--border);
  }

  .adeo-actions {
    grid-template-columns: 44px 1fr auto;
  }

  .adeo-actions .btn-primary {
    grid-column: auto;
  }
}

@media (max-width: 640px) {
  .adeo-actions {
    grid-template-columns: 1fr;
  }

  .theme-toggle,
  .adeo-actions .btn {
    width: 100%;
  }
}

<script>
const C={
  hslToRgb(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]},
  rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')},
  hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]},
  rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6}h*=360}return[Math.round(h),Math.round(s*100),Math.round(l*100)]},
  hslToHex(h,s,l){return this.rgbToHex(...this.hslToRgb(h,s,l))},hexToHsl(hex){return this.rgbToHsl(...this.hexToRgb(hex))},
  luminance(r,g,b){const a=[r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return a[0]*.2126+a[1]*.7152+a[2]*.0722},
  contrast(h1,h2){const l1=this.luminance(...this.hexToRgb(h1)),l2=this.luminance(...this.hexToRgb(h2));return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)},
  isLight(hex){return this.luminance(...this.hexToRgb(hex))>.4},shades(h,s,l,n=11){const r=[];for(let i=0;i<n;i++){const t=i/(n-1);r.push(this.hslToHex(h,Math.min(100,s+t*10),95-t*90))}return r}
};
const harmonies={complementary:h=>[(h+180)%360],analogous:h=>[(h+30)%360,(h-30+360)%360],triadic:h=>[(h+120)%360,(h+240)%360],'split-comp':h=>[(h+150)%360,(h+210)%360],tetradic:h=>[(h+90)%360,(h+180)%360,(h+270)%360],monochromatic:()=>[]};
function rng(a,b){return a+Math.random()*(b-a)}function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
const colorKW={'ชมพู':{h:[330,350],s:[50,85],l:[55,75]},pink:{h:[330,350],s:[50,85],l:[55,75]},'แดง':{h:[0,15],s:[65,90],l:[40,55]},red:{h:[0,15],s:[65,90],l:[40,55]},'ส้ม':{h:[20,38],s:[70,95],l:[50,65]},orange:{h:[20,38],s:[70,95],l:[50,65]},'เขียว':{h:[110,145],s:[40,75],l:[40,60]},green:{h:[110,145],s:[40,75],l:[40,60]},'ฟ้า':{h:[190,210],s:[60,85],l:[55,72]},blue:{h:[215,240],s:[55,85],l:[40,58]},'น้ำเงิน':{h:[215,240],s:[55,85],l:[40,58]},'ม่วง':{h:[265,290],s:[50,80],l:[45,62]},purple:{h:[265,290],s:[50,80],l:[45,62]},'ทอง':{h:[40,50],s:[70,90],l:[50,60]},gold:{h:[40,50],s:[70,90],l:[50,60]},'เทา':{h:[0,360],s:[0,10],l:[40,60]},gray:{h:[0,360],s:[0,10],l:[40,60]},'พีช':{h:[15,30],s:[60,85],l:[70,82]},peach:{h:[15,30],s:[60,85],l:[70,82]},'คอรัล':{h:[5,18],s:[65,85],l:[58,70]},coral:{h:[5,18],s:[65,85],l:[58,70]}};
const moodKW={'ละมุน':{s:[-25,-15],l:[10,20]},'อ่อน':{s:[-20,-10],l:[12,22]},soft:{s:[-25,-15],l:[10,20]},pastel:{s:[-25,-10],l:[15,25]},'เข้ม':{s:[5,15],l:[-20,-12]},dark:{s:[5,15],l:[-20,-12]},'สดใส':{s:[20,35],l:[0,10]},vibrant:{s:[20,35],l:[0,8]},'ธรรมชาติ':{s:[-30,-15],l:[-5,5]},natural:{s:[-30,-15],l:[-5,5]},'หรูหรา':{s:[5,15],l:[-15,-5]},luxury:{s:[5,15],l:[-15,-5]},'เรียบหรู':{s:[-15,-5],l:[-5,8]},'วินเทจ':{s:[-35,-20],l:[-5,8]}};
function generateFromPrompt(text){text=text.toLowerCase().trim();if(!text)return null;let bH,bS,bL,sM=0,lM=0,found=false;for(const[kw,c]of Object.entries(colorKW)){if(text.includes(kw)){bH=rng(c.h[0],c.h[1]);bS=rng(c.s[0],c.s[1]);bL=rng(c.l[0],c.l[1]);found=true;break}}for(const[kw,c]of Object.entries(moodKW)){if(text.includes(kw)){sM+=rng(c.s[0],c.s[1]);lM+=rng(c.l[0],c.l[1])}}if(!found){bH=Math.random()*360;bS=50+Math.random()*30;bL=45+Math.random()*20}bS=clamp(bS+sM,8,100);bL=clamp(bL+lM,8,92);const pal=[],hs=[0,30,-30,58,-58];for(let i=0;i<5;i++)pal.push(C.hslToHex(Math.round((bH+hs[i]+360)%360),Math.round(clamp(bS+rng(-12,12),8,100)),Math.round(clamp(bL+rng(-10,10),10,90))));return{h:Math.round(bH),s:Math.round(bS),l:Math.round(bL),palette:pal}}
const DEFAULT_ADMIN_THEME={primary:'#0066FF',secondary:'#0A1628',accent:'#3385FF',muted:'#EFF6FF',success:'#22C55E'};
let S={h:216,s:100,l:50,harmony:'analogous',locked:[false,false,false,false,false],customPalette:true,palette:[DEFAULT_ADMIN_THEME.primary,DEFAULT_ADMIN_THEME.secondary,DEFAULT_ADMIN_THEME.accent,DEFAULT_ADMIN_THEME.muted,DEFAULT_ADMIN_THEME.success]};
function setDefaultAdminPalette(){const[h,s,l]=C.hexToHsl(DEFAULT_ADMIN_THEME.primary);S.h=h;S.s=s;S.l=l;S.harmony='analogous';S.locked=[false,false,false,false,false];S.customPalette=true;S.palette=[DEFAULT_ADMIN_THEME.primary,DEFAULT_ADMIN_THEME.secondary,DEFAULT_ADMIN_THEME.accent,DEFAULT_ADMIN_THEME.muted,DEFAULT_ADMIN_THEME.success]}
function getHex(){return C.hslToHex(S.h,S.s,S.l)}
function getPalette(){if(S.customPalette&&S.palette.length===5)return S.palette;const offs=harmonies[S.harmony](S.h);let cols=[C.hslToHex(S.h,S.s,S.l)];if(S.harmony==='monochromatic'){[20,40,-15,-30].forEach(d=>cols.push(C.hslToHex(S.h,clamp(S.s+d*.5,10,100),clamp(S.l+d,10,90))))}else{offs.forEach(oh=>cols.push(C.hslToHex(oh,S.s,S.l)));while(cols.length<5){const i=cols.length;cols.push(C.hslToHex((S.h+i*47)%360,Math.max(20,S.s-15),Math.min(85,S.l+10)))}}if(S.palette.length===5)cols=cols.map((c,i)=>S.locked[i]?S.palette[i]:c);S.palette=cols.slice(0,5);return S.palette}
const presets=[{name:'ADEO Blue',colors:['#0066FF','#0A1628','#3385FF','#EFF6FF','#22C55E']},{name:'Ocean',colors:['#0B2545','#13315C','#134074','#8DA9C4','#EEF4ED']},{name:'Berry',colors:['#2D0032','#5C0067','#A31ACB','#F075AA','#FFB3C6']},{name:'Forest',colors:['#1B4332','#2D6A4F','#40916C','#52B788','#95D5B2']},{name:'Neon',colors:['#FF006E','#FB5607','#FFBE0B','#3A86FF','#8338EC']},{name:'Pastel',colors:['#FFD6E0','#FFEFCF','#C1FFC1','#C1E1FF','#E8D5FF']},{name:'Earth',colors:['#582F0E','#7F4F24','#936639','#A68A64','#B6AD90']},{name:'Cyber',colors:['#0D0221','#0F084B','#26408B','#A6CFD5','#C2E7D9']}];
const quickPrompts=['น้ำเงิน ลึก','ม่วง เรียบหรู','เขียว ธรรมชาติ','ฟ้า สดชื่น','แดง จัดจ้าน','พีช หวาน','ทอง หรูหรา','พาสเทล นุ่ม'];
const paletteUsageMap=[
  {title:'Color 1 · Primary',label:'ปุ่มหลัก',css:'--admin-primary',fgCss:'--admin-primary-foreground',textTarget:'ตัวหนังสือบนปุ่มหลัก / active menu',desc:'ใช้กับปุ่มหลัก, active menu, เส้นเน้น และ highlight สำคัญ'},
  {title:'Color 2 · Sidebar',label:'Sidebar',css:'--admin-secondary',fgCss:'--admin-sidebar-foreground',textTarget:'ตัวหนังสือใน sidebar / Admin Portal / user card',desc:'ใช้กับพื้นหลัง sidebar, navigation และพื้นที่หลักของเมนู'},
  {title:'Color 3 · Accent',label:'Accent',css:'--admin-accent',fgCss:'--admin-accent-foreground',textTarget:'ตัวหนังสือบน accent state / icon highlight',desc:'ใช้กับ icon, focus ring, hover state และจุดตกแต่ง'},
  {title:'Color 4 · Muted',label:'Soft BG',css:'--admin-muted',fgCss:'--admin-muted-foreground',textTarget:'ตัวหนังสือบนพื้นหลังอ่อน / card tint',desc:'ใช้กับพื้นหลังอ่อน, card tint, border และพื้นที่พักสายตา'},
  {title:'Color 5 · Success',label:'Success',css:'--admin-success',fgCss:'--admin-success-foreground',textTarget:'ตัวหนังสือบน badge success / success message',desc:'ใช้กับ badge สถานะ, success message และ action เชิงบวก'}
];
function getReadableTextColor(hex){return C.luminance(...C.hexToRgb(hex))>.45?'#0F172A':'#FFFFFF'}
function getReadableTextLabel(hex){return getReadableTextColor(hex)==='#0F172A'?'สีดำ':'สีขาว'}
function buildPaletteUsageHTML(palette){
  return palette.map((c,i)=>{
    const u=paletteUsageMap[i]||paletteUsageMap[0];
    const t=getReadableTextColor(c);
    const textName=getReadableTextLabel(c);
    return `<div class="usage-card" onclick="clip('${c}',this)">
      <div class="usage-top">
        <span class="usage-swatch" style="background:${c}"></span>
        <div class="usage-heading">
          <div class="usage-title">${u.title}</div>
          <div class="usage-hex">พื้นหลัง ${c.toUpperCase()}</div>
        </div>
      </div>

      <div class="usage-preview" style="background:${c};color:${t}">
        <span>${u.label}</span>
      </div>

      <p class="usage-desc">${u.desc}</p>

      <div class="usage-text-detail">
        <div class="usage-text-row">
          <span class="usage-text-label">ตัวหนังสือ</span>
          <span class="usage-text-chip">
            <span class="usage-text-swatch" style="background:${t}"></span>
            ${textName} <code>${t}</code>
          </span>
        </div>
        <p class="usage-text-note">หลัง Save: ${u.textTarget}</p>
      </div>

      <div class="usage-vars">
        <span class="usage-var">${u.css}</span>
        <span class="usage-var usage-foreground-var">${u.fgCss}</span>
      </div>

      <div class="toast">Copied!</div>
    </div>`
  }).join('')
}

function getFavs(){try{return JSON.parse(localStorage.getItem('adeo_palette_favs')||'[]')}catch{return[]}}function saveFavs(a){localStorage.setItem('adeo_palette_favs',JSON.stringify(a))}function addFav(n,p,h){const f=getFavs();f.unshift({id:Date.now(),name:n,palette:[...p],harmony:h,created:new Date().toISOString()});saveFavs(f)}function removeFav(id){saveFavs(getFavs().filter(f=>f.id!==id))}function renameFav(id,n){const f=getFavs();const x=f.find(i=>i.id===id);if(x)x.name=n;saveFavs(f)}
function buildShareURL(){const d={h:S.h,s:S.s,l:S.l,m:S.harmony,p:S.palette.map(c=>c.replace('#',''))};return location.origin+location.pathname+'#p='+btoa(JSON.stringify(d))}function loadFromURL(){try{const h=location.hash;if(!h.startsWith('#p='))return false;const d=JSON.parse(atob(h.slice(3)));S.h=d.h;S.s=d.s;S.l=d.l;S.harmony=d.m||'analogous';S.palette=d.p.map(c=>'#'+c);S.customPalette=true;return true}catch{return false}}function shareToLine(){window.open('https://line.me/R/share?text='+encodeURIComponent('🎨 NEW PALETTE\n'+S.palette.join(' ')+'\n'+buildShareURL()),'_blank')}function shareToFB(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(buildShareURL())+'&quote='+encodeURIComponent('🎨 NEW PALETTE: '+S.palette.join(' ')),'_blank','width=600,height=400')}function copyShareLink(){navigator.clipboard.writeText(buildShareURL()).then(()=>{const t=document.getElementById('shareToast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)})}
function clip(text,el){navigator.clipboard.writeText(text).then(()=>{const t=el?.querySelector('.toast');if(t){t.classList.add('show');setTimeout(()=>t.classList.remove('show'),700)}})}
function openSaveModal(){document.getElementById('modalContent').innerHTML=`<h2 class="modal-title-row"><span class="modal-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></span><span>Save Palette</span></h2><p>ตั้งชื่อ palette เพื่อเก็บไว้ใช้ภายหลัง</p><input class="modal-input" id="favNameInput" placeholder="เช่น ADEO Blue, Admin Fresh..." autofocus><div class="modal-palette">${S.palette.map(c=>`<div style="background:${c}"></div>`).join('')}</div><div class="modal-btns"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmSave()">Save</button></div>`;document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('favNameInput')?.focus(),200)}
function openRenameModal(id,cn){document.getElementById('modalContent').innerHTML=`<h2>✏️ Rename</h2><p>แก้ไขชื่อ Palette</p><input class="modal-input" id="renameInput" value="${cn}"><div class="modal-btns"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmRename(${id})">Save</button></div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}function confirmSave(){const n=document.getElementById('favNameInput')?.value.trim()||'Palette '+Date.now()%10000;addFav(n,S.palette,S.harmony);closeModal();render()}function confirmRename(id){const n=document.getElementById('renameInput')?.value.trim();if(n){renameFav(id,n);closeModal();render()}}
let isDark=true;function initTheme(){const saved=localStorage.getItem('adeo_palette_theme');if(saved==='light'){isDark=false;document.documentElement.setAttribute('data-theme','light')}}function toggleTheme(){isDark=!isDark;document.documentElement.setAttribute('data-theme',isDark?'':'light');localStorage.setItem('adeo_palette_theme',isDark?'dark':'light')}function goHome(){setDefaultAdminPalette();history.replaceState(null,'',location.pathname);render();window.scrollTo({top:0,behavior:'smooth'})}
function getCustomTags(){try{return JSON.parse(localStorage.getItem('adeo_palette_tags')||'[]')}catch{return[]}}function saveCustomTags(a){localStorage.setItem('adeo_palette_tags',JSON.stringify(a))}function addCustomTag(text){const tags=getCustomTags(),clean=text.trim();if(!clean||tags.includes(clean)||quickPrompts.includes(clean))return;tags.unshift(clean);if(tags.length>20)tags.pop();saveCustomTags(tags)}function removeCustomTag(text){saveCustomTags(getCustomTags().filter(t=>t!==text));render()}
function setHarmony(m){S.harmony=m;S.customPalette=false;render()}function toggleLock(i){S.locked[i]=!S.locked[i];render()}function randomize(){S.h=Math.floor(Math.random()*360);S.s=40+Math.floor(Math.random()*50);S.l=35+Math.floor(Math.random()*35);S.customPalette=false;render()}function loadPreset(c){const[h,s,l]=C.hexToHsl(c[0]);S.h=h;S.s=s;S.l=l;S.locked=[false,false,false,false,false];S.customPalette=true;S.palette=[...c].slice(0,5);render()}function loadFav(id){const f=getFavs().find(x=>x.id===id);if(!f)return;const[h,s,l]=C.hexToHsl(f.palette[0]);S.h=h;S.s=s;S.l=l;S.locked=[false,false,false,false,false];S.customPalette=true;S.palette=[...f.palette].slice(0,5);if(f.harmony&&harmonies[f.harmony])S.harmony=f.harmony;render()}function deleteFav(id){removeFav(id);render()}function setHex(v){try{if(!v.startsWith('#'))v='#'+v;const[h,s,l]=C.hexToHsl(v);S.h=h;S.s=s;S.l=l;S.customPalette=false;render()}catch{}}function runPrompt(){const inp=document.getElementById('promptInput');if(!inp)return;const t=inp.value.trim();if(!t)return;const r=generateFromPrompt(t);if(r){S.h=r.h;S.s=r.s;S.l=r.l;S.locked=[false,false,false,false,false];S.customPalette=true;S.palette=[...r.palette];addCustomTag(t);render();setTimeout(()=>{const e=document.getElementById('promptInput');if(e)e.value=t},10)}}function useQuickPrompt(t){const r=generateFromPrompt(t);if(r){S.h=r.h;S.s=r.s;S.l=r.l;S.locked=[false,false,false,false,false];S.customPalette=true;S.palette=[...r.palette];render();setTimeout(()=>{const e=document.getElementById('promptInput');if(e)e.value=t},10)}}
function liveUpdate(){const pal=getPalette(),hex=getHex(),rgb=C.hexToRgb(hex),shades=C.shades(S.h,S.s,S.l),cW=C.contrast(hex,'#FFFFFF').toFixed(2),cB=C.contrast(hex,'#000000').toFixed(2);const el=id=>document.getElementById(id);if(el('hVal'))el('hVal').textContent=S.h+'°';if(el('sVal'))el('sVal').textContent=S.s+'%';if(el('lVal'))el('lVal').textContent=S.l+'%';if(el('sSlider'))el('sSlider').style.background=`linear-gradient(90deg,${C.hslToHex(S.h,0,S.l)},${C.hslToHex(S.h,100,S.l)})`;if(el('lSlider'))el('lSlider').style.background=`linear-gradient(90deg,${C.hslToHex(S.h,S.s,5)},${C.hslToHex(S.h,S.s,50)},${C.hslToHex(S.h,S.s,95)})`;if(el('wcenter'))el('wcenter').style.background=hex;if(el('swatchPrev'))el('swatchPrev').style.background=hex;if(el('hexInput')&&document.activeElement!==el('hexInput'))el('hexInput').value=hex.toUpperCase();positionCursor();pal.forEach((c,i)=>{const e=el('ps'+i);if(e){const lt=C.isLight(c);e.style.background=c;e.className='pal-swatch '+(lt?'light':'dark');const label=e.querySelector('.sw-label');if(label)label.textContent=c.toUpperCase()}});if(el('paletteUsageGrid'))el('paletteUsageGrid').innerHTML=buildPaletteUsageHTML(pal);if(el('infoHex'))el('infoHex').textContent=hex.toUpperCase();if(el('infoRgb'))el('infoRgb').textContent=rgb.join(', ');if(el('infoHsl'))el('infoHsl').textContent=`${S.h}, ${S.s}%, ${S.l}%`;if(el('shadesGrid'))el('shadesGrid').innerHTML=shades.map(sh=>`<div class="shade-cell" style="background:${sh}" onclick="clip('${sh}',this)"><span class="shade-tip">${sh.toUpperCase()}</span><div class="toast" style="font-size:.5rem">✓</div></div>`).join('');if(el('crW'))el('crW').innerHTML=`<div class="c-ratio" style="color:${hex}">${cW}</div><div class="c-label">vs White</div><span class="c-badge ${cW>=4.5?'c-pass':'c-fail'}">${cW>=4.5?'AA ✓':'AA ✗'}</span><span class="c-badge ${cW>=7?'c-pass':'c-fail'}" style="margin-left:3px">${cW>=7?'AAA ✓':'AAA ✗'}</span>`;if(el('crB'))el('crB').innerHTML=`<div class="c-ratio" style="color:${hex}">${cB}</div><div class="c-label">vs Black</div><span class="c-badge ${cB>=4.5?'c-pass':'c-fail'}">${cB>=4.5?'AA ✓':'AA ✗'}</span><span class="c-badge ${cB>=7?'c-pass':'c-fail'}" style="margin-left:3px">${cB>=7?'AAA ✓':'AAA ✗'}</span>`;if(el('cpW'))el('cpW').style.background=hex;if(el('cpB'))el('cpB').style.background=hex;if(el('uiPreview'))el('uiPreview').innerHTML=pal.map((c,i)=>{const t=C.isLight(c)?'#111':'#fff',sub=C.isLight(c)?'rgba(0,0,0,.45)':'rgba(255,255,255,.55)';return`<div style="background:${c};border-radius:16px;padding:16px;color:${t}"><div style="width:28px;height:28px;border-radius:50%;background:${t};opacity:.12;margin-bottom:10px"></div><div style="font-size:.82rem;font-weight:700">Color ${i+1}</div><div style="font-size:.65rem;color:${sub};margin-top:2px;font-family:var(--mono)">${c.toUpperCase()}</div></div>`}).join('');if(el('shareUrl'))el('shareUrl').textContent=buildShareURL();drawWheel();sendPaletteToAdmin()}
function onSlide(prop,val){S[prop]=parseInt(val);S.customPalette=false;liveUpdate()}function showExport(t){const e=document.getElementById('exportOut');e.style.display='block';e.querySelector('code').textContent=t;navigator.clipboard.writeText(t)}function exportCSS(){const n=['primary','secondary','accent','muted','success'];showExport(`:root {\n${S.palette.map((c,i)=>`  --admin-${n[i]}: ${c};`).join('\n')}\n}`)}function exportTailwind(){const n=['primary','secondary','accent','muted','success'];showExport(`colors: {\n${S.palette.map((c,i)=>`  '${n[i]}': '${c}',`).join('\n')}\n}`)}function exportJSON(){showExport(JSON.stringify({palette:S.palette,harmony:S.harmony,base:{h:S.h,s:S.s,l:S.l}},null,2))}function exportSCSS(){const n=['primary','secondary','accent','muted','success'];showExport(S.palette.map((c,i)=>`$admin-${n[i]}: ${c};`).join('\n'))}

function loadSavedAdminTheme(){
  try{
    const savedTheme=localStorage.getItem("adeo-admin-theme");
    if(!savedTheme)return false;

    const theme=JSON.parse(savedTheme);

    if(!theme||!theme.primary||!theme.secondary||!theme.accent||!theme.muted||!theme.success){
      return false;
    }

    const palette=[
      theme.primary,
      theme.secondary,
      theme.accent,
      theme.muted,
      theme.success
    ];

    const [h,s,l]=C.hexToHsl(theme.primary);

    S.h=h;
    S.s=s;
    S.l=l;
    S.harmony="analogous";
    S.locked=[false,false,false,false,false];
    S.customPalette=true;
    S.palette=palette;

    return true;
  }catch(e){
    return false;
  }
}
